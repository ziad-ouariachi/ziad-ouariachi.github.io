<!doctype html>
<!-- Social preview card (1200x630). Rendered to assets/og-image.png by tools/build_brand.py -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; background: #0b1220; color: #ece8df; font-family: Inter, sans-serif;
    display: grid; grid-template-columns: 1fr 360px; align-items: center; gap: 72px; padding: 0 88px;
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(220,187,118,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(220,187,118,.07) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 70% 80% at 75% 40%, #000 25%, transparent 75%);
  }
  body::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(40% 55% at 80% 30%, rgba(220,187,118,.16), transparent 70%), radial-gradient(35% 50% at 5% 95%, rgba(60,100,170,.22), transparent 70%);
  }
  .copy, .photo { position: relative; z-index: 1; }
  .eyebrow { display: flex; align-items: center; gap: 14px; font-size: 17px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #dcbb76; }
  .eyebrow::before { content: ""; width: 40px; height: 1.5px; background: currentColor; }
  h1 { margin-top: 26px; font-family: Fraunces, serif; font-weight: 500; font-size: 92px; line-height: 1; letter-spacing: -.025em; }
  h1 em { font-weight: 400; color: #dcbb76; }
  .title { margin-top: 26px; font-size: 30px; font-weight: 500; color: #cfd5e0; }
  .title span { color: #dcbb76; margin: 0 .3em; }
  .firms { margin-top: 40px; padding-top: 26px; border-top: 1px solid #22304d; font-size: 21px; color: #9aa5b8; line-height: 1.5; }
  .photo { width: 360px; height: 450px; }
  .photo::before { content: ""; position: absolute; inset: 18px -18px -18px 18px; border: 1.5px solid #dcbb76; border-radius: 26px; opacity: .75; }
  .photo img { position: relative; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; border-radius: 26px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.7); }
</style>
</head>
<body>
  <div class="copy">
    <div class="eyebrow">Casablanca · Morocco</div>
    <h1>Ziad <em>Ouariachi</em></h1>
    <p class="title">Senior Equity Research Analyst</p>
    <p class="firms">Bernstein · Société Générale Group<br>Valoris Securities · Ascent Capital Partners</p>
  </div>
  <div class="photo"><img src="../../assets/ziad-ouariachi.jpg" alt=""></div>
</body>
</html>
